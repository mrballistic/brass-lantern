<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0a0a08"/>
  <g font-family="'VT323', 'Courier New', monospace" fill="#FFB000">
    <text x="90" y="150" font-size="44" opacity="0.6">═══════════════════════════════</text>
    <text x="90" y="250" font-size="110" letter-spacing="6">BRASS LANTERN</text>
    <text x="90" y="320" font-size="44" opacity="0.85">a text adventure engine</text>
    <text x="90" y="400" font-size="44" opacity="0.6">═══════════════════════════════</text>
    <text x="90" y="500" font-size="44" fill="#88ffaa">&gt; light lantern</text>
